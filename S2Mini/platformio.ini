[platformio]
default_envs = master, receiver, receiver-rgb

[env]
platform = espressif32@6.12.0
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=0

[env:master]
build_src_filter = +<master.cpp>

[env:receiver]
build_src_filter = +<receiver.cpp>

[env:receiver-rgb]
build_src_filter = +<receiver.cpp>
build_flags =
    ${env.build_flags}
    -D TALLY_WS2812=1

; Sony REC uses BLE: the ESP32-S2 does not support this profile.
[env:sony-c3]
board = lolin_c3_mini
build_src_filter = +<sony.cpp>
board_build.partitions = min_spiffs.csv
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
lib_deps = h2zero/NimBLE-Arduino@1.4.3
