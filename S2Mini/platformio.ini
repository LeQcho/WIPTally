[platformio]
default_envs = master, receiver

[env]
platform = espressif32@6.12.0
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=0

[env:master]
build_src_filter = +<master.cpp>

[env:receiver]
build_src_filter = +<receiver.cpp>
